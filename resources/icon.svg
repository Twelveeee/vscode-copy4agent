<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- copy4agent icon: a code page with a highlighted line selection, handed off to an agent via an @-mention bubble. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23295E"/>
      <stop offset="1" stop-color="#4B2C9E"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9F43"/>
      <stop offset="1" stop-color="#F0603C"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- copy shadow page -->
  <rect x="28" y="14" width="60" height="78" rx="8" fill="#FFFFFF" fill-opacity="0.18"/>

  <!-- page -->
  <rect x="18" y="22" width="60" height="78" rx="8" fill="#F4F6FF"/>

  <!-- gutter -->
  <g fill="#A5ABD6">
    <rect x="24" y="33" width="5" height="4" rx="2"/>
    <rect x="24" y="44" width="5" height="4" rx="2"/>
    <rect x="24" y="77" width="5" height="4" rx="2"/>
    <rect x="24" y="88" width="5" height="4" rx="2"/>
  </g>

  <!-- selection band -->
  <rect x="21" y="52" width="54" height="22" rx="4" fill="#FFD166"/>
  <g fill="#B7791F">
    <rect x="24" y="55" width="5" height="4" rx="2"/>
    <rect x="24" y="66" width="5" height="4" rx="2"/>
  </g>

  <!-- code lines -->
  <g fill="#6B72B8">
    <rect x="33" y="33" width="30" height="4" rx="2"/>
    <rect x="38" y="44" width="22" height="4" rx="2"/>
    <rect x="33" y="77" width="18" height="4" rx="2"/>
    <rect x="33" y="88" width="26" height="4" rx="2"/>
  </g>
  <g fill="#3A2E7A">
    <rect x="38" y="55" width="32" height="4" rx="2"/>
    <rect x="38" y="66" width="24" height="4" rx="2"/>
  </g>

  <!-- agent bubble -->
  <path d="M88 60 a26 26 0 1 1 -16.6 46 l-9.4 4.6 l3.2 -10.4 A26 26 0 0 1 88 60 Z" fill="url(#bubble)" stroke="#23295E" stroke-width="3"/>

  <!-- @ -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="88" cy="86" r="5.5"/>
    <path d="M93.5 80.5 V89 a3.5 3.5 0 0 0 7 0 V86 a12.5 12.5 0 1 0 -4.5 9.6"/>
  </g>
</svg>
